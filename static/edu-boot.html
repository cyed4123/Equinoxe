<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Starting proxy…</title>
    <link rel="icon" type="image/x-icon" href="/assets/img/favicon.ico" />
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #111;
            color: #eee;
            font: 16px/1.5 system-ui, sans-serif;
            text-align: center;
            padding: 24px;
        }
    </style>
</head>

<body>
    <p id="status">Starting the proxy…</p>
    <script>
        // A proxied URL was opened directly (hard refresh, private window), so the
        // service worker that normally answers /edu/* is not running yet.
        // Register it, then reload so the worker takes over the request.
        (async function () {
            const status = document.getElementById('status');
            const key = 'equinox||edu-boot';

            if (!('serviceWorker' in navigator)) {
                status.textContent = 'This browser does not support service workers, which the proxy needs.';
                return;
            }

            const attempts = Number(sessionStorage.getItem(key) || 0);
            if (attempts >= 2) {
                sessionStorage.removeItem(key);
                status.textContent = 'The proxy could not start. Open the homepage and try again.';
                return;
            }

            try {
                sessionStorage.setItem(key, attempts + 1);
                await navigator.serviceWorker.register('/sw.js', { scope: '/edu/' });
                await navigator.serviceWorker.ready;
                location.reload();
            } catch (error) {
                sessionStorage.removeItem(key);
                status.textContent = 'The proxy could not start: ' + error.message;
            }
        })();
    </script>
</body>

</html>
