<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Starting proxy…</title>
    <link rel="icon" type="image/x-icon" href="/assets/img/favicon.ico" />
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #111;
            color: #eee;
            font: 16px/1.5 system-ui, sans-serif;
            text-align: center;
            padding: 24px;
        }

        .wrap {
            max-width: 34rem;
        }

        .detail {
            margin-top: 1.25rem;
            font-size: 12px;
            line-height: 1.6;
            opacity: 0.55;
            word-break: break-word;
        }

        a {
            color: #8ab4f8;
        }
    </style>
</head>

<body>
    <div class="wrap">
        <p id="status">Starting the proxy…</p>
        <p class="detail" id="detail"></p>
        <p class="detail"><a href="/">Open the homepage</a></p>
    </div>
    <script>
        // A proxied URL was opened directly (hard refresh, new tab, private window),
        // so the service worker that normally answers /edu/* is not running yet.
        // Register it, then reload so the worker takes over the request.
        (async function () {
            const status = document.getElementById('status');
            const detail = document.getElementById('detail');
            const key = 'equinox||edu-boot';

            const attempts = {
                read() { try { return Number(sessionStorage.getItem(key) || 0); } catch (e) { return 0; } },
                write(n) { try { sessionStorage.setItem(key, n); } catch (e) { /* storage blocked */ } },
                clear() { try { sessionStorage.removeItem(key); } catch (e) { /* storage blocked */ } },
            };

            const hasWorkerApi = 'serviceWorker' in navigator;
            const controlled = !!(navigator.serviceWorker && navigator.serviceWorker.controller);

            // Shown in every outcome, so a stuck page reports why instead of guessing.
            detail.textContent = [
                'secure context: ' + (window.isSecureContext ? 'yes' : 'no'),
                'service worker API: ' + (hasWorkerApi ? 'available' : 'missing'),
                'worker controlling this page: ' + (controlled ? 'yes' : 'no'),
            ].join(' · ');

            if (!window.isSecureContext) {
                status.textContent = 'This page must be opened over HTTPS for the proxy to start.';
                return;
            }

            if (!hasWorkerApi) {
                status.textContent = 'This browser profile is blocking service workers, which the proxy needs. Leave private/incognito mode, allow cookies for this site, and reload — or use a different browser.';
                return;
            }

            const so_far = attempts.read();
            if (so_far >= 2) {
                attempts.clear();
                status.textContent = 'The proxy could not start after two attempts. Open the homepage and try again.';
                return;
            }

            try {
                attempts.write(so_far + 1);
                await navigator.serviceWorker.register('/sw.js', { scope: '/edu/' });
                await navigator.serviceWorker.ready;
                location.reload();
            } catch (error) {
                attempts.clear();
                status.textContent = 'The proxy could not start: ' + (error && error.message ? error.message : error);
            }
        })();
    </script>
</body>

</html>
